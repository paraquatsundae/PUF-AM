# Build PUFAM Android APK and attach to a GitHub Release.
# Default: debug APK (no signing secrets). Optional release signing via repo secrets.
name: Release Android APK

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'debug (default, no secrets) or release (needs keystore secrets)'
        required: false
        default: 'debug'
        type: choice
        options:
          - debug
          - release
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  NODE_VERSION: '20'
  JAVA_VERSION: '21'

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install npm dependencies
        run: npm ci

      - name: Resolve build type
        id: meta
        shell: bash
        run: |
          TYPE="${{ github.event.inputs.build_type }}"
          if [ -z "$TYPE" ]; then TYPE=debug; fi
          if [ "$TYPE" = "release" ] && [ -z "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "Release requested but ANDROID_KEYSTORE_BASE64 missing — falling back to debug."
            TYPE=debug
          fi
          echo "build_type=$TYPE" >> "$GITHUB_OUTPUT"
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="apk-${{ github.run_number }}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Vite + Capacitor sync (packaged, points at live app)
        env:
          VITE_CAPACITOR: '1'
          CAP_PACKAGED: '1'
          VITE_API_BASE_URL: https://am.pufworks.farm
          VITE_APP_URL: https://am.pufworks.farm
        run: |
          npx vite build
          npx cap sync android

      - name: Decode keystore (release only)
        if: steps.meta.outputs.build_type == 'release'
        shell: bash
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/release.keystore
          cat > android/keystore.properties <<EOF
          storeFile=release.keystore
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          EOF

      - name: Assemble debug APK
        if: steps.meta.outputs.build_type == 'debug'
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug --stacktrace

      - name: Assemble release APK
        if: steps.meta.outputs.build_type == 'release'
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleRelease --stacktrace

      - name: Stage PUFAM.apk
        id: apk
        shell: bash
        run: |
          TYPE="${{ steps.meta.outputs.build_type }}"
          if [ "$TYPE" = "release" ]; then
            SRC=$(find android/app/build/outputs/apk/release -name '*.apk' | head -n1)
          else
            SRC=$(find android/app/build/outputs/apk/debug -name '*.apk' | head -n1)
          fi
          test -n "$SRC" && test -f "$SRC"
          mkdir -p dist-apk
          cp "$SRC" dist-apk/PUFAM.apk
          echo "path=dist-apk/PUFAM.apk" >> "$GITHUB_OUTPUT"
          ls -la dist-apk/PUFAM.apk

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: PUFAM ${{ steps.meta.outputs.tag }}
          body: |
            Android APK for PUF-AM (Ag Manager).

            - Build type: `${{ steps.meta.outputs.build_type }}`
            - API / app URL baked in: `https://am.pufworks.farm`
            - Marketing: https://pufworks.farm/pufam/

            Sideload `PUFAM.apk` after enabling install from unknown sources.
          files: ${{ steps.apk.outputs.path }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
